<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Questers Shop Prototype</title>
  <style>
    :root {
      --gold: #d8b05f;
      --gold-bright: #ffe7a1;
      --panel: rgba(8, 17, 23, 0.82);
      --panel-2: rgba(14, 35, 42, 0.78);
      --ink: #f3e4be;
      --muted: #b9a786;
      --teal: #2b7780;
      --wine: #7a3036;
      --danger: #bf4f45;
      --blue: #67a9ca;
      --shadow: rgba(0, 0, 0, 0.6);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #05070b;
      color: var(--ink);
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      overflow: hidden;
    }

    button {
      font: inherit;
    }

    .stage {
      width: min(100vw, 177.777vh);
      aspect-ratio: 16 / 9;
      position: relative;
      overflow: hidden;
      background: #070b10 url("./shop_art_plate_v2.png") center / cover no-repeat;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.75);
    }

    .stage::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 24% 14%, rgba(255, 190, 94, 0.08), transparent 24%),
        linear-gradient(180deg, transparent 66%, rgba(0, 0, 0, 0.12));
    }

    .resource-strip {
      position: absolute;
      left: 42.2%;
      top: 3.3%;
      width: 25.6%;
      height: 4.8%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 28px;
      color: var(--gold-bright);
      font-size: clamp(11px, 1vw, 17px);
      text-shadow: 0 2px 0 #000;
      pointer-events: none;
    }

    .resource-strip span {
      white-space: nowrap;
    }

    .merchant-note {
      position: absolute;
      left: 3.9%;
      top: 40.2%;
      width: 13.3%;
      height: 42.2%;
      padding: 17px 14px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: 12px;
      color: #eadcb9;
      text-shadow: 0 2px 0 #000;
      pointer-events: none;
    }

    .merchant-note h1 {
      margin: 0;
      font-size: clamp(18px, 1.45vw, 28px);
      letter-spacing: 4px;
      color: var(--gold-bright);
    }

    .merchant-note p {
      margin: 0;
      color: #d3c0a0;
      line-height: 1.55;
      font-size: clamp(11px, 0.86vw, 15px);
    }

    .tab-rail {
      position: absolute;
      left: 15.55%;
      top: 40.4%;
      width: 3.75%;
      display: flex;
      flex-direction: column;
      gap: 24px;
      z-index: 5;
    }

    .shop-tab {
      width: 100%;
      aspect-ratio: 1;
      border: 1px solid rgba(236, 197, 105, 0.8);
      border-radius: 10px;
      color: #efe2bd;
      background: rgba(22, 64, 69, 0.84);
      box-shadow: 0 8px 12px rgba(0, 0, 0, 0.35), inset 0 0 0 1px rgba(255,255,255,0.06);
      cursor: pointer;
      display: grid;
      place-items: center;
      font-size: clamp(19px, 1.8vw, 32px);
      text-shadow: 0 2px 0 #000;
      transition: transform 0.16s ease, filter 0.16s ease, box-shadow 0.16s ease;
    }

    .shop-tab:hover,
    .shop-tab.active {
      transform: translateX(5px);
      filter: brightness(1.15);
      box-shadow: 0 0 16px rgba(241, 196, 15, 0.28), 0 9px 14px rgba(0,0,0,0.42);
    }

    .shop-tab[data-view="relic"] { background: rgba(79, 44, 99, 0.9); }
    .shop-tab[data-view="copy"] { background: rgba(43, 99, 73, 0.9); }
    .shop-tab[data-view="delete"] { background: rgba(104, 42, 42, 0.92); }

    .content {
      position: absolute;
      left: 23.6%;
      top: 13.8%;
      width: 41.2%;
      height: 68.5%;
      padding: 23px 26px;
      overflow: hidden;
      z-index: 2;
    }

    #content-body {
      position: relative;
      height: calc(100% - 70px);
      min-height: 0;
    }

    .content-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 14px;
    }

    .eyebrow {
      color: var(--muted);
      font-size: clamp(10px, 0.84vw, 14px);
      letter-spacing: 2px;
      text-shadow: 0 2px 0 #000;
    }

    .content-title {
      margin: 4px 0 0;
      color: var(--gold-bright);
      font-size: clamp(20px, 1.75vw, 32px);
      letter-spacing: 5px;
      text-shadow: 0 3px 0 #000;
    }

    .filter-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .filter-chip {
      min-width: 34px;
      height: 28px;
      border: 1px solid rgba(216,176,95,0.45);
      border-radius: 5px;
      background: rgba(4, 13, 18, 0.62);
      color: #d8c394;
      cursor: pointer;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04);
      font-size: 12px;
    }

    .filter-chip.active {
      color: var(--gold-bright);
      border-color: rgba(255,226,137,0.82);
      background: rgba(37, 76, 78, 0.82);
    }

    .market-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 15px;
      height: 100%;
      align-content: start;
    }

    .proto-card {
      min-width: 0;
      height: 247px;
      border: 1px solid rgba(216, 176, 95, 0.72);
      border-radius: 8px 3px 8px 3px;
      background: linear-gradient(180deg, rgba(31, 51, 64, 0.98), rgba(9, 14, 20, 0.98));
      box-shadow: 0 12px 20px rgba(0,0,0,0.44), inset 0 0 0 1px rgba(255,255,255,0.06);
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .proto-card.is-sale::before {
      content: "半价";
      position: absolute;
      top: 9px;
      right: -23px;
      width: 92px;
      padding: 4px 0;
      transform: rotate(31deg);
      text-align: center;
      color: #fff0bd;
      background: linear-gradient(180deg, #ba4a3e, #641a1f);
      border: 1px solid rgba(255,226,137,0.76);
      font-size: 12px;
      z-index: 3;
      text-shadow: 0 2px 0 #000;
    }

    .card-art {
      height: 104px;
      background: #111 center / cover no-repeat;
      border-bottom: 1px solid rgba(216, 176, 95, 0.35);
      position: relative;
    }

    .card-art::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 42%, rgba(0,0,0,0.45));
    }

    .card-body {
      padding: 10px 11px 11px;
      display: flex;
      flex: 1;
      flex-direction: column;
      min-height: 0;
    }

    .card-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      color: var(--gold-bright);
      font-size: 17px;
      font-weight: 800;
      text-shadow: 0 2px 0 #000;
      white-space: nowrap;
    }

    .cost {
      width: 27px;
      height: 27px;
      flex: none;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255,226,137,0.7);
      border-radius: 50%;
      color: #fff1be;
      background: radial-gradient(circle at 35% 28%, #5fb2c6, #17374d 66%, #081522);
      box-shadow: 0 2px 0 #000;
      font-size: 14px;
    }

    .card-meta,
    .card-desc {
      color: #cdbb96;
      font-size: 12px;
      line-height: 1.42;
      margin-top: 7px;
    }

    .card-desc {
      color: #d7c8aa;
      flex: 1;
      overflow: hidden;
    }

    .tag-row {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .tag {
      color: #ffe29a;
      border: 1px solid rgba(216,176,95,0.48);
      background: rgba(8, 24, 30, 0.82);
      padding: 2px 5px;
      border-radius: 3px;
      font-size: 11px;
      white-space: nowrap;
    }

    .price-btn {
      width: calc(100% - 20px);
      margin: 0 10px 10px;
      min-height: 30px;
      border: 1px solid rgba(255,226,137,0.7);
      border-radius: 5px 2px;
      color: #fff0bc;
      background: linear-gradient(180deg, rgba(33, 75, 90, 0.96), rgba(7, 28, 40, 0.98));
      cursor: pointer;
      text-shadow: 0 2px 0 #000;
      box-shadow: 0 5px 9px rgba(0,0,0,0.42), inset 0 0 0 1px rgba(255,255,255,0.06);
    }

    .relic-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      height: auto;
      align-content: start;
      position: relative;
      z-index: 2;
    }

    .relic-showcase {
      height: 100%;
      display: grid;
      grid-template-rows: minmax(116px, 34%) 1fr;
      gap: 10px;
      min-height: 0;
    }

    .relic-tray-art {
      width: min(94%, 560px);
      max-height: 146px;
      object-fit: contain;
      justify-self: center;
      align-self: center;
      filter: drop-shadow(0 16px 18px rgba(0,0,0,0.5));
      pointer-events: none;
    }

    .relic-token {
      min-height: 184px;
      padding: 18px 14px;
      border: 1px solid rgba(216,176,95,0.62);
      border-radius: 8px 3px;
      background: radial-gradient(circle at 50% 14%, rgba(255,226,137,0.18), transparent 46%),
        linear-gradient(180deg, rgba(31,45,54,0.96), rgba(8,12,18,0.98));
      text-align: center;
      color: #e8d8b5;
      box-shadow: 0 12px 20px rgba(0,0,0,0.4), inset 0 0 0 1px rgba(255,255,255,0.05);
      cursor: pointer;
    }

    .relic-icon {
      width: 68px;
      height: 68px;
      margin: 0 auto 12px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: #fff0b8;
      background: radial-gradient(circle at 35% 32%, rgba(255,236,164,0.82), rgba(35,94,112,0.88) 58%, rgba(8,15,22,0.96));
      border: 2px solid rgba(216,176,95,0.8);
      font-size: 34px;
      text-shadow: 0 2px 0 #000;
    }

    .relic-name {
      color: var(--gold-bright);
      font-size: 18px;
      font-weight: 800;
      text-shadow: 0 2px 0 #000;
    }

    .relic-desc {
      margin-top: 9px;
      font-size: 12px;
      line-height: 1.55;
      color: #cdbb96;
    }

    .deck-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      height: 100%;
      position: relative;
      min-height: 0;
    }

    .service-workbench-art {
      position: absolute;
      right: 2%;
      bottom: 1%;
      width: min(44%, 280px);
      opacity: 0.32;
      filter: drop-shadow(0 16px 18px rgba(0,0,0,0.56));
      pointer-events: none;
      z-index: 0;
    }

    .deck-list {
      overflow-y: auto;
      padding-right: 9px;
      position: relative;
      z-index: 2;
      -webkit-mask-image: linear-gradient(180deg, transparent 0, black 20px, black calc(100% - 24px), transparent 100%);
      mask-image: linear-gradient(180deg, transparent 0, black 20px, black calc(100% - 24px), transparent 100%);
      scrollbar-width: thin;
      scrollbar-color: rgba(216,176,95,0.52) rgba(0,0,0,0.2);
    }

    .deck-row {
      width: 100%;
      min-height: 62px;
      margin-bottom: 8px;
      padding: 8px 10px;
      border: 1px solid rgba(216,176,95,0.32);
      border-radius: 6px;
      background: linear-gradient(90deg, rgba(15,33,40,0.9), rgba(7,12,18,0.76));
      backdrop-filter: blur(2px);
      display: grid;
      grid-template-columns: 38px 1fr auto;
      gap: 11px;
      align-items: center;
      color: #eadcb9;
      cursor: pointer;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.03);
      text-align: left;
    }

    .deck-row:hover,
    .deck-row.active {
      border-color: rgba(255,226,137,0.78);
      background: linear-gradient(90deg, rgba(31,73,80,0.96), rgba(12,23,30,0.9));
    }

    .deck-row.disabled {
      opacity: 0.48;
      filter: grayscale(0.35);
    }

    .mini-art {
      width: 38px;
      height: 44px;
      border: 1px solid rgba(216,176,95,0.56);
      border-radius: 4px;
      background: #111 center / cover no-repeat;
    }

    .row-title {
      display: flex;
      align-items: center;
      gap: 7px;
      color: #fff0bc;
      font-weight: 800;
      font-size: 15px;
      text-shadow: 0 2px 0 #000;
    }

    .row-meta {
      margin-top: 5px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      color: #c8b58d;
      font-size: 11px;
    }

    .pill {
      border: 1px solid rgba(216,176,95,0.36);
      background: rgba(3,12,17,0.58);
      border-radius: 3px;
      padding: 2px 5px;
      white-space: nowrap;
    }

    .row-price {
      color: #ffe39d;
      font-size: 14px;
      text-align: right;
      white-space: nowrap;
      text-shadow: 0 2px 0 #000;
    }

    .detail {
      position: absolute;
      left: 69.2%;
      top: 14.4%;
      width: 26.2%;
      height: 38.8%;
      padding: 24px;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 3;
    }

    .detail .proto-card {
      width: min(260px, 78%);
      height: 100%;
      min-height: 300px;
      transform: none;
    }

    .confirm {
      position: absolute;
      left: 69.2%;
      top: 61.6%;
      width: 26.2%;
      height: 22%;
      padding: 24px 27px;
      z-index: 3;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      color: #e8d8b5;
      text-shadow: 0 2px 0 #000;
    }

    .confirm h2 {
      margin: 0;
      color: var(--gold-bright);
      font-size: clamp(19px, 1.45vw, 28px);
      letter-spacing: 4px;
    }

    .confirm p {
      margin: 9px 0 0;
      line-height: 1.5;
      color: #cdbb96;
      font-size: clamp(12px, 0.9vw, 15px);
    }

    .confirm .stat-line {
      margin-top: 12px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      font-size: 13px;
      color: #ffe0a2;
    }

    .action-row {
      position: absolute;
      left: 70.2%;
      top: 88.4%;
      width: 28.1%;
      height: 7.8%;
      display: grid;
      grid-template-columns: 1fr 1.08fr;
      gap: 32px;
      z-index: 5;
    }

    .action-btn {
      border: 1px solid rgba(238,194,101,0.75);
      border-radius: 9px;
      color: #fff0bc;
      cursor: pointer;
      background: transparent;
      text-shadow: 0 2px 0 #000;
      font-weight: 800;
      letter-spacing: 3px;
      box-shadow: 0 8px 14px rgba(0,0,0,0.28);
    }

    .action-btn:hover {
      filter: brightness(1.16);
      box-shadow: 0 0 14px rgba(241,196,15,0.22), 0 9px 14px rgba(0,0,0,0.34);
    }

    .action-btn.primary {
      background: rgba(23, 71, 79, 0.58);
    }

    .action-btn.leave {
      background: rgba(96, 34, 37, 0.56);
    }

    .empty-state {
      height: 100%;
      display: grid;
      place-items: center;
      color: #cdbb96;
      text-align: center;
      line-height: 1.7;
      padding: 40px;
    }
  </style>
</head>
<body>
  <main class="stage" aria-label="商店原型">
    <div class="resource-strip">
      <span>金币 185</span>
      <span>牌组 20</span>
      <span>楼层 7</span>
    </div>

    <section class="merchant-note">
      <h1>幻市商人</h1>
      <p id="merchant-copy">货架、拓印与精简都在同一间店里完成。你可以随时离开。</p>
    </section>

    <nav class="tab-rail" aria-label="商店功能">
      <button class="shop-tab active" data-view="market" title="货架">✦</button>
      <button class="shop-tab" data-view="relic" title="奇珍">◆</button>
      <button class="shop-tab" data-view="copy" title="拓印">✧</button>
      <button class="shop-tab" data-view="delete" title="精简">✂</button>
    </nav>

    <section class="content">
      <div class="content-head">
        <div>
          <div class="eyebrow" id="view-eyebrow">MARKET SHELF</div>
          <h2 class="content-title" id="view-title">今日货架</h2>
        </div>
        <div class="filter-row" id="filter-row"></div>
      </div>
      <div id="content-body"></div>
    </section>

    <aside class="detail" id="detail-panel"></aside>
    <aside class="confirm" id="confirm-panel"></aside>

    <div class="action-row">
      <button class="action-btn primary" id="context-action">补货 10</button>
      <button class="action-btn leave">离开商店</button>
    </div>
  </main>

      { id: 'a1', name: '青牙初矢', type: '攻击', cost: 1, rarity: '普通', theme: 'archer', tags: ['剧毒'], val: 8, price: 46, art: 'cards/art/archer/archer_green_fang_art_v1.png', desc: '毒血路线的起手牌。' },
      { id: 'a2', name: '风誓扣弦', type: '能力', cost: 1, rarity: '普通', theme: 'archer', tags: ['蓄力'], val: 0, price: 43, art: 'cards/art/archer/archer_wind_string_art_v1.png', desc: '为追击和高伤害牌做铺垫。' },
      { id: 'a3', name: '空谷飞刃', type: '攻击', cost: 1, rarity: '普通', theme: 'archer', tags: ['销毁'], val: 5, price: 41, art: 'cards/art/archer/archer_empty_valley_knife_art_v1.png', desc: '便宜但会消耗自身，删除价值较低。' },
      { id: 'a4', name: '归巢血轨', type: '攻击', cost: 2, rarity: '史诗', theme: 'archer', tags: ['回收', '出血'], val: 16, price: 124, art: 'cards/art/archer/archer_nest_track_art_v1.png', desc: '放逐与毒血之间的桥。', up: true },
      { id: 'a5', name: '毒荆护步', type: '防御', cost: 1, rarity: '稀有', theme: 'archer', tags: ['剧毒', '闪避'], val: 10, price: 82, art: 'cards/art/archer/archer_poison_step_art_v1.png', desc: '防御时继续推进毒血节奏。' },
      { id: 'n1', name: '空白契约', type: '能力', cost: 1, rarity: '普通', theme: 'neutral', tags: ['抽牌', '销毁'], val: 0, price: 37, art: 'cards/art/neutral/neutral_blank_pact_art_v1.png', desc: '普通过牌，后期常见删除目标。' },
      { id: 'n2', name: '灰烬路标', type: '能力', cost: 1, rarity: '稀有', theme: 'neutral', tags: ['易伤', '抽牌'], val: 0, price: 68, art: 'cards/art/neutral/neutral_ash_marker_art_v1.png', desc: '通用破势牌，适合多数构筑。' },
      { id: 'n3', name: '冷铁护页', type: '防御', cost: 1, rarity: '普通', theme: 'neutral', tags: ['庇护'], val: 7, price: 40, art: 'cards/art/neutral/neutral_cold_iron_page_art_v1.png', desc: '简单防御，牌组臃肿时可以精简。' },
      { id: 'n4', name: '镜火短章', type: '攻击', cost: 0, rarity: '普通', theme: 'neutral', tags: ['复刻'], val: 4, price: 42, art: 'cards/art/neutral/neutral_mirror_spark_art_v1.png', desc: '低费触发牌，复制价值看构筑。' },
      { id: 'n5', name: '旅人短歌', type: '能力', cost: 1, rarity: '稀有', theme: 'neutral', tags: ['抽牌'], val: 0, price: 70, art: 'cards/art/neutral/neutral_traveler_song_art_v1.png', desc: '通用补牌，能稳定寻找核心。' }
    ];

    const relics = [
      { icon: '💍', name: '血誓指环', desc: '首次吸血后强化低血线伤害。', price: 140 },
      { icon: '🪞', name: '秘仪魔镜', desc: '回响与复刻路线的核心奇珍。', price: 190, sale: true },
      { icon: '🧭', name: '风轮罗盘', desc: '让回收节奏更主动。', price: 170 }
    ];

    const marketCards = [cards[0], cards[6], cards[14]].map((card, index) => ({ ...card, sale: index === 1 }));
    let view = 'market';
    let selectedId = cards[0].id;
    let filter = 'all';

    const tabs = document.querySelectorAll('.shop-tab');
    const body = document.getElementById('content-body');
    const detail = document.getElementById('detail-panel');
    const confirm = document.getElementById('confirm-panel');
    const title = document.getElementById('view-title');
    const eyebrow = document.getElementById('view-eyebrow');
    const filters = document.getElementById('filter-row');
    const contextAction = document.getElementById('context-action');
    const merchantCopy = document.getElementById('merchant-copy');

    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        view = tab.dataset.view;
        if (view === 'copy' || view === 'delete') selectedId = visibleCards()[0]?.id || cards[0].id;
        render();
      });
    });

    contextAction.addEventListener('click', () => {
      if (view === 'market' || view === 'relic') {
        pulseMessage('商人翻出新的货箱，补货费用将在正式接入时结算。');
      } else {
        view = 'market';
        render();
      }
    });

    document.querySelector('.action-btn.leave').addEventListener('click', () => {
      pulseMessage('原型中不推进地图；正式接入时这里会离开商店。');
    });

    function visibleCards() {
      if (filter === 'all') return cards;
      return cards.filter(card => card.type === filter || card.rarity === filter || card.theme === filter);
    }

    function art(card) {
      return `${ART_PREFIX}${card.art}`;
    }

    function copyPrice(card) {
      let price = 65;
      if (card.rarity === '稀有') price += 20;
      if (card.rarity === '史诗') price += 45;
      if (card.up) price += 25;
      return Math.max(30, price);
    }

    function cardHTML(card, opts = {}) {
      const tags = (card.tags || []).slice(0, 3).map(tag => `<span class="tag">${tag}</span>`).join('');
      return `
        <article class="proto-card ${card.sale ? 'is-sale' : ''}">
          <div class="card-art" style="background-image:url('${art(card)}')"></div>
          <div class="card-body">
            <div class="card-title"><span>${card.name}</span><span class="cost">${card.cost}</span></div>
            <div class="card-meta">${card.type} · ${card.rarity}${card.up ? ' · 已强化' : ''}</div>
            <div class="card-desc">${card.desc}</div>
            <div class="tag-row">${tags}</div>
          </div>
          ${opts.price ? `<button class="price-btn">${opts.price}</button>` : ''}
        </article>
      `;
    }

    function renderFilters(show) {
      filters.innerHTML = '';
      if (!show) return;
      [
        ['all', '全'],
        ['攻击', '攻'],
        ['防御', '防'],
        ['能力', '能'],
        ['稀有', '稀'],
        ['史诗', '史']
      ].forEach(([id, label]) => {
        const btn = document.createElement('button');
        btn.className = `filter-chip ${filter === id ? 'active' : ''}`;
        btn.textContent = label;
        btn.addEventListener('click', () => {
          filter = id;
          selectedId = visibleCards()[0]?.id || cards[0].id;
          render();
        });
        filters.appendChild(btn);
      });
    }

    function renderMarket() {
      title.textContent = '今日货架';
      eyebrow.textContent = 'MARKET SHELF';
      merchantCopy.textContent = '货架展示三张卡牌与奇珍，半价商品用蜡封标出。';
      contextAction.textContent = '补货 10';
      renderFilters(false);
      body.innerHTML = `<div class="market-grid">${marketCards.map(card => cardHTML(card, { price: `购买 ${card.sale ? Math.floor(card.price / 2) : card.price}` })).join('')}</div>`;
      detail.innerHTML = cardHTML(marketCards[0]);
      confirm.innerHTML = `
        <div>
          <h2>货架说明</h2>
          <p>原型只展示购买感受。正式接入时会生成 3 张奖励卡牌和最多 3 件适配奇珍。</p>
          <div class="stat-line"><span>补货递增</span><span>半价标记</span></div>
        </div>
      `;
    }

    function renderRelics() {
      title.textContent = '奇珍陈列';
      eyebrow.textContent = 'RELIC CASE';
      merchantCopy.textContent = '奇珍和卡牌仍然在同一个商店框架里，只是切到陈列柜。';
      contextAction.textContent = '补货 10';
      renderFilters(false);
      body.innerHTML = `
        <div class="relic-showcase">
          <img class="relic-tray-art" src="./shop_art_relic_tray.png" alt="">
          <div class="relic-grid">
            ${relics.map(relic => `
              <button class="relic-token">
                <div class="relic-icon">${relic.icon}</div>
                <div class="relic-name">${relic.name}</div>
                <div class="relic-desc">${relic.desc}</div>
                <div class="tag-row" style="justify-content:center;"><span class="tag">${relic.sale ? '半价 ' : ''}${relic.price} 金</span></div>
              </button>
            `).join('')}
          </div>
        </div>
      `;
      detail.innerHTML = `<div class="empty-state">奇珍详情会在这里显示<br>正式接入时读取真实遗物描述</div>`;
      confirm.innerHTML = `
        <div>
          <h2>奇珍购买</h2>
          <p>保留同一套右侧确认区，不把玩家带到另一个入口。</p>
          <div class="stat-line"><span>适配当前角色</span><span>可售罄</span></div>
        </div>
      `;
    }

    function renderDeckService(mode) {
      const isCopy = mode === 'copy';
      title.textContent = isCopy ? '拓印卡牌' : '精简牌库';
      eyebrow.textContent = isCopy ? 'COPY SERVICE' : 'DELETE SERVICE';
      merchantCopy.textContent = isCopy
        ? '从压缩清单选择一张牌，右侧确认拓印价格。'
        : '从压缩清单选择负累牌，右侧确认遗忘契约。';
      contextAction.textContent = '返回货架';
      renderFilters(true);
      const list = visibleCards();
      if (!list.some(card => card.id === selectedId)) selectedId = list[0]?.id || cards[0].id;
      const selected = cards.find(card => card.id === selectedId) || list[0] || cards[0];
      body.innerHTML = `
        <div class="deck-layout">
          <img class="service-workbench-art" src="./shop_art_service_workbench.png" alt="">
          <div class="deck-list">
            ${list.map(card => deckRowHTML(card, selected.id, mode)).join('')}
          </div>
        </div>
      `;
      body.querySelectorAll('.deck-row').forEach(row => {
        row.addEventListener('click', () => {
          selectedId = row.dataset.id;
          render();
        });
      });
      detail.innerHTML = cardHTML(selected);
      if (isCopy) {
        const price = copyPrice(selected);
        confirm.innerHTML = `
          <div>
            <h2>确认拓印</h2>
            <p>复制一张 ${selected.rarity}「${selected.name}」加入牌组。已强化和高稀有度会提高价格。</p>
            <div class="stat-line"><span>费用 ${price} 金</span><span>牌组 20 -> 21</span></div>
          </div>
          <button class="price-btn">拓印 ${price}</button>
        `;
      } else {
        confirm.innerHTML = `
          <div>
            <h2>确认遗忘</h2>
            <p>从牌组中移除「${selected.name}」。正式接入时删除费用会随次数递增。</p>
            <div class="stat-line"><span>费用 50 金</span><span>牌组 20 -> 19</span></div>
          </div>
          <button class="price-btn" style="background:linear-gradient(180deg, rgba(128,48,44,.95), rgba(55,16,20,.98));">签下契约</button>
        `;
      }
    }

    function deckRowHTML(card, selected, mode) {
      const price = mode === 'copy' ? copyPrice(card) : 50;
      const tags = (card.tags || []).slice(0, 3).map(tag => `<span class="pill">${tag}</span>`).join('');
      const duplicate = ['空白契约', '冷铁护页', '林影矢'].includes(card.name) ? 'x2' : '';
      return `
        <button class="deck-row ${selected === card.id ? 'active' : ''}" data-id="${card.id}">
          <span class="mini-art" style="background-image:url('${art(card)}')"></span>
          <span>
            <span class="row-title">${card.name} <span class="cost">${card.cost}</span></span>
            <span class="row-meta">
              <span class="pill">${card.type}</span>
              <span class="pill">${card.rarity}</span>
              ${card.up ? '<span class="pill">已强化</span>' : ''}
              ${duplicate ? `<span class="pill">${duplicate}</span>` : ''}
              ${tags}
            </span>
          </span>
          <span class="row-price">${price} 金</span>
        </button>
      `;
    }

    function pulseMessage(message) {
      merchantCopy.textContent = message;
      window.clearTimeout(pulseMessage.timer);
      pulseMessage.timer = window.setTimeout(render, 1200);
    }

    function render() {
      tabs.forEach(tab => tab.classList.toggle('active', tab.dataset.view === view));
      if (view === 'market') renderMarket();
      if (view === 'relic') renderRelics();
      if (view === 'copy') renderDeckService('copy');
      if (view === 'delete') renderDeckService('delete');
    }

    render();
  </script>
</body>
</html>
